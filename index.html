<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nortem — Controle Financeiro</title>
<meta name="description" content="Sua vida financeira, organizada." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230FA678'/%3E%3Cpath d='M7 24V8.8c0-.9 1.1-1.3 1.7-.6l11.6 13c.6.7 1.7.3 1.7-.6V8' stroke='white' stroke-width='3.4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M19.4 8H25v5.6' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>

<!-- PDF parsing (bank statement import) -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js" defer></script>

<!-- Supabase configuration -->
<script src="supabase-config.js"></script>

<script>
  // Avoids a flash of the app shell before the login screen is ready,
  // when cloud mode is on.
  if(window.SUPABASE_URL && window.SUPABASE_ANON_KEY){
    document.write('<style>#app{display:none}</style>');
  }
</script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>

<!-- Main stylesheet -->
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- ============ AUTH SCREEN (only shown when cloud sync is configured) ============ -->
<div class="auth-screen" id="authScreen" hidden>
  <div class="auth-card">

    <div class="brand" style="justify-content:center; padding-bottom:8px;">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 24V8.8c0-.9 1.1-1.3 1.7-.6l11.6 13c.6.7 1.7.3 1.7-.6V8"
            stroke="currentColor"
            stroke-width="3.4"
            stroke-linecap="round"/>
          <path d="M19.4 8H25v5.6"
            stroke="currentColor"
            stroke-width="3.4"
            stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>
      </span>

      <span class="brand-name">Nortem</span>
    </div>

    <p class="auth-subtitle" id="authSubtitle">
      Entre para acessar suas finanças de qualquer lugar.
    </p>

    <div class="segmented" id="authTabs" style="margin-bottom:18px;">
      <button type="button" data-tab="login" class="active">
        Entrar
      </button>

      <button type="button" data-tab="signup">
        Criar conta
      </button>
    </div>

    <form id="authForm">

      <div class="field">
        <label>E-mail</label>
        <input
          type="email"
          id="authEmail"
          required
          placeholder="voce@email.com"
        />
      </div>

      <div class="field" style="margin-top:12px;">
        <label>Senha</label>
        <input
          type="password"
          id="authPassword"
          required
          minlength="6"
          placeholder="Mínimo 6 caracteres"
        />
      </div>

      <div id="authError" class="auth-error" hidden></div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="authSubmit"
        style="margin-top:18px;"
      >
        Entrar
      </button>

    </form>

    <p class="auth-foot">
      Seus dados ficam isolados por login — cada pessoa vê só as próprias informações, em qualquer dispositivo.
    </p>

  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div class="app" id="app">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <span class="brand-mark">
        <svg
          viewBox="0 0 32 32"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M7 24V8.8c0-.9 1.1-1.3 1.7-.6l11.6 13c.6.7 1.7.3 1.7-.6V8"
            stroke="currentColor"
            stroke-width="3.4"
            stroke-linecap="round"
          />

          <path
            d="M19.4 8H25v5.6"
            stroke="currentColor"
            stroke-width="3.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span class="brand-name">Nortem</span>

    </div>

    <nav class="nav" id="mainNav">

      <button class="nav-item" data-route="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>Início</span>
      </button>

      <button class="nav-item" data-route="transactions">
        <i data-lucide="arrow-left-right"></i>
        <span>Lançamentos</span>
      </button>

      <button class="nav-item" data-route="budgets">
        <i data-lucide="pie-chart"></i>
        <span>Orçamentos</span>
      </button>

      <button class="nav-item" data-route="cards">
        <i data-lucide="credit-card"></i>
        <span>Cartões</span>
      </button>

      <button class="nav-item" data-route="accounts">
        <i data-lucide="wallet"></i>
        <span>Contas</span>
      </button>

      <button class="nav-item" data-route="debts">
        <i data-lucide="trending-down"></i>
        <span>Dívidas</span>
      </button>

      <button class="nav-item" data-route="investments">
        <i data-lucide="trending-up"></i>
        <span>Investimentos</span>
      </button>

      <button class="nav-item" data-route="goals">
        <i data-lucide="target"></i>
        <span>Metas</span>
      </button>

      <button class="nav-item" data-route="forecast">
        <i data-lucide="calendar-clock"></i>
        <span>Previsão</span>
      </button>

      <button class="nav-item" data-route="settings">
        <i data-lucide="settings"></i>
        <span>Configurações</span>
      </button>

    </nav>

    <button class="theme-toggle" id="themeToggle">
      <i data-lucide="moon"></i>
      <span>Modo escuro</span>
    </button>

  </aside>

  <!-- Main -->
  <main class="main">

    <header class="topbar">

      <button class="icon-btn only-mobile" id="menuBtn">
        <i data-lucide="menu"></i>
      </button>

      <div class="topbar-title" id="topbarTitle">
        Início
      </div>

      <select
        class="filter-select month-picker"
        id="globalMonthSelect"
        title="Mês de referência"
      ></select>

      <div class="topbar-actions">

        <button class="icon-btn" id="alertsBtn">
          <i data-lucide="bell"></i>
          <span class="dot" id="alertsDot" hidden></span>
        </button>

        <button class="btn btn-primary" id="newTxBtn">
          <i data-lucide="plus"></i>
          <span>Novo lançamento</span>
        </button>

      </div>

    </header>

    <div class="view-container" id="view"></div>

  </main>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" id="bottomNav">

    <button class="bn-item" data-route="dashboard">
      <i data-lucide="home"></i>
      <span>Início</span>
    </button>

    <button class="bn-item" data-route="transactions">
      <i data-lucide="arrow-left-right"></i>
      <span>Lançamentos</span>
    </button>

    <button class="bn-item" data-route="cards">
      <i data-lucide="credit-card"></i>
      <span>Cartões</span>
    </button>

    <button class="bn-item" data-route="goals">
      <i data-lucide="target"></i>
      <span>Metas</span>
    </button>

    <button class="bn-item" id="moreNavBtn">
      <i data-lucide="menu"></i>
      <span>Mais</span>
    </button>

  </nav>

  <button class="bn-fab" id="fabAdd">
    <i data-lucide="plus"></i>
  </button>

</div>

<!-- Mobile "mais" sheet -->
<div class="sheet-backdrop" id="moreBackdrop" hidden>

  <div class="sheet" id="moreSheet">

    <div class="sheet-handle"></div>

    <button class="sheet-item" data-route="budgets">
      <i data-lucide="pie-chart"></i>
      <span>Orçamentos</span>
    </button>

    <button class="sheet-item" data-route="accounts">
      <i data-lucide="wallet"></i>
      <span>Contas</span>
    </button>

    <button class="sheet-item" data-route="debts">
      <i data-lucide="trending-down"></i>
      <span>Dívidas</span>
    </button>

    <button class="sheet-item" data-route="investments">
      <i data-lucide="trending-up"></i>
      <span>Investimentos</span>
    </button>

    <button class="sheet-item" data-route="forecast">
      <i data-lucide="calendar-clock"></i>
      <span>Previsão</span>
    </button>

    <button class="sheet-item" data-route="settings">
      <i data-lucide="settings"></i>
      <span>Configurações</span>
    </button>

  </div>

</div>

<!-- Overlay root for modals -->
<div id="modalRoot"></div>

<!-- AI Assistant: floating button + slide-over panel -->
<button
  class="assistant-fab"
  id="assistantFab"
  title="Assistente Nortem"
>
  <i data-lucide="sparkles"></i>
</button>

<div
  class="assistant-backdrop"
  id="assistantBackdrop"
  hidden
></div>

<aside
  class="assistant-panel"
  id="assistantPanel"
  hidden
>

  <div class="assistant-head">

    <div class="assistant-head-title">

      <div class="assistant-avatar">
        <i data-lucide="sparkles"></i>
      </div>

      <div>
        <b>Assistente Nortem</b>
        <span class="assistant-mode" id="assistantModeTag">
          modo básico
        </span>
      </div>

    </div>

    <button class="icon-btn" id="closeAssistant">
      <i data-lucide="x"></i>
    </button>

  </div>

  <div
    class="assistant-messages"
    id="assistantMessages"
  ></div>

  <div class="assistant-inputbar">

    <button
      class="icon-btn"
      id="assistantAttach"
      title="Importar extrato (PDF)"
    >
      <i data-lucide="paperclip"></i>
    </button>

    <input
      type="file"
      id="assistantPdfInput"
      accept="application/pdf"
      style="display:none;"
    />

    <textarea
      id="assistantInput"
      rows="1"
      placeholder="Pergunte algo ou diga um gasto: &quot;gastei 45 no mercado hoje&quot;"
    ></textarea>

    <button
      class="icon-btn assistant-send"
      id="assistantSend"
    >
      <i data-lucide="arrow-up"></i>
    </button>

  </div>

</aside>

<!-- Toast root -->
<div
  id="toastRoot"
  class="toast-root"
></div>

<!-- ============ SCRIPTS ============ -->

<!-- Core -->
<script src="utils.js"></script>
<script src="store.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>

<!-- Charts / Reports / Imports / Assistant -->
<script src="charts.js"></script>
<script src="report.js"></script>
<script src="pdf-import.js"></script>
<script src="assistant.js"></script>

<!-- Views -->
<script src="dashboard.js"></script>
<script src="transactions.js"></script>
<script src="budgets.js"></script>
<script src="cards.js"></script>
<script src="accounts.js"></script>
<script src="debts.js"></script>
<script src="investments.js"></script>
<script src="goals.js"></script>
<script src="forecast.js"></script>
<script src="settings.js"></script>

<!-- Application -->
<script src="app.js"></script>

</body>
</html>
