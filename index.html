```html
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Nortem — Controle Financeiro</title>

<meta name="description" content="Sua vida financeira, organizada." />

<!-- =========================
     FONTES
========================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<!-- =========================
     ÍCONES
========================= -->
<script
  src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
  defer
></script>

<!-- =========================
     GRÁFICOS
========================= -->
<script
  src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
  defer
></script>

<!-- =========================
     CSS
========================= -->
<link rel="stylesheet" href="./styles.css" />

</head>

<body>

<!-- =====================================================
     APP
===================================================== -->

<div class="app" id="app">

  <!-- ===================================================
       SIDEBAR DESKTOP
  ==================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <span class="brand-mark">N</span>
      <span class="brand-name">Nortem</span>
    </div>

    <nav class="nav" id="mainNav">

      <button class="nav-item" data-route="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>Início</span>
      </button>

      <button class="nav-item" data-route="transactions">
        <i data-lucide="arrow-left-right"></i>
        <span>Lançamentos</span>
      </button>

      <button class="nav-item" data-route="budgets">
        <i data-lucide="pie-chart"></i>
        <span>Orçamentos</span>
      </button>

      <button class="nav-item" data-route="cards">
        <i data-lucide="credit-card"></i>
        <span>Cartões</span>
      </button>

      <button class="nav-item" data-route="accounts">
        <i data-lucide="wallet"></i>
        <span>Contas</span>
      </button>

      <button class="nav-item" data-route="debts">
        <i data-lucide="trending-down"></i>
        <span>Dívidas</span>
      </button>

      <button class="nav-item" data-route="investments">
        <i data-lucide="trending-up"></i>
        <span>Investimentos</span>
      </button>

      <button class="nav-item" data-route="goals">
        <i data-lucide="target"></i>
        <span>Metas</span>
      </button>

      <button class="nav-item" data-route="forecast">
        <i data-lucide="calendar-clock"></i>
        <span>Previsão</span>
      </button>

      <button class="nav-item" data-route="settings">
        <i data-lucide="settings"></i>
        <span>Configurações</span>
      </button>

    </nav>

    <!-- MODO ESCURO -->

    <button class="theme-toggle" id="themeToggle">

      <i data-lucide="moon"></i>

      <span>Modo escuro</span>

    </button>

  </aside>


  <!-- ===================================================
       ÁREA PRINCIPAL
  ==================================================== -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <!-- Menu mobile -->

      <button
        class="icon-btn only-mobile"
        id="menuBtn"
      >
        <i data-lucide="menu"></i>
      </button>


      <!-- Título -->

      <div
        class="topbar-title"
        id="topbarTitle"
      >
        Início
      </div>


      <!-- Ações -->

      <div class="topbar-actions">

        <button
          class="icon-btn"
          id="alertsBtn"
        >

          <i data-lucide="bell"></i>

          <span
            class="dot"
            id="alertsDot"
            hidden
          ></span>

        </button>


        <button
          class="btn btn-primary"
          id="newTxBtn"
        >

          <i data-lucide="plus"></i>

          <span>Novo lançamento</span>

        </button>

      </div>

    </header>


    <!-- =================================================
         CONTEÚDO DINÂMICO
    ================================================== -->

    <div
      class="view-container"
      id="view"
    ></div>

  </main>


  <!-- ===================================================
       MENU INFERIOR MOBILE
  ==================================================== -->

  <nav
    class="bottom-nav"
    id="bottomNav"
  >

    <button
      class="bn-item"
      data-route="dashboard"
    >

      <i data-lucide="home"></i>

      <span>Início</span>

    </button>


    <button
      class="bn-item"
      data-route="transactions"
    >

      <i data-lucide="arrow-left-right"></i>

      <span>Lançamentos</span>

    </button>


    <button
      class="bn-item"
      data-route="cards"
    >

      <i data-lucide="credit-card"></i>

      <span>Cartões</span>

    </button>


    <button
      class="bn-item"
      data-route="goals"
    >

      <i data-lucide="target"></i>

      <span>Metas</span>

    </button>


    <button
      class="bn-item"
      id="moreNavBtn"
    >

      <i data-lucide="menu"></i>

      <span>Mais</span>

    </button>

  </nav>


  <!-- BOTÃO FLUTUANTE MOBILE -->

  <button
    class="bn-fab"
    id="fabAdd"
  >

    <i data-lucide="plus"></i>

  </button>

</div>


<!-- =====================================================
     MENU "MAIS" MOBILE
===================================================== -->

<div
  class="sheet-backdrop"
  id="moreBackdrop"
  hidden
>

  <div
    class="sheet"
    id="moreSheet"
  >

    <div class="sheet-handle"></div>


    <button
      class="sheet-item"
      data-route="budgets"
    >

      <i data-lucide="pie-chart"></i>

      <span>Orçamentos</span>

    </button>


    <button
      class="sheet-item"
      data-route="accounts"
    >

      <i data-lucide="wallet"></i>

      <span>Contas</span>

    </button>


    <button
      class="sheet-item"
      data-route="debts"
    >

      <i data-lucide="trending-down"></i>

      <span>Dívidas</span>

    </button>


    <button
      class="sheet-item"
      data-route="investments"
    >

      <i data-lucide="trending-up"></i>

      <span>Investimentos</span>

    </button>


    <button
      class="sheet-item"
      data-route="forecast"
    >

      <i data-lucide="calendar-clock"></i>

      <span>Previsão</span>

    </button>


    <button
      class="sheet-item"
      data-route="settings"
    >

      <i data-lucide="settings"></i>

      <span>Configurações</span>

    </button>

  </div>

</div>


<!-- =====================================================
     MODAIS
===================================================== -->

<div id="modalRoot"></div>


<!-- =====================================================
     TOASTS / NOTIFICAÇÕES
===================================================== -->

<div
  id="toastRoot"
  class="toast-root"
></div>


<!-- =====================================================
     JAVASCRIPT
     
     IMPORTANTE:
     Os arquivos estão todos na raiz do projeto.
===================================================== -->

<script src="./utils.js"></script>

<script src="./store.js"></script>

<script src="./ui.js"></script>

<script src="./charts.js"></script>

<script src="./dashboard.js"></script>

<script src="./transactions.js"></script>

<script src="./budgets.js"></script>

<script src="./cards.js"></script>

<script src="./accounts.js"></script>

<script src="./debts.js"></script>

<script src="./investments.js"></script>

<script src="./goals.js"></script>

<script src="./forecast.js"></script>

<script src="./settings.js"></script>

<script src="./app.js"></script>

</body>
</html>
```
